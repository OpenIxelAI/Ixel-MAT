name: checks

# The fast test suites, on every pull request and every push to main: Linux on the oldest
# Python Ixel MAT supports, and Windows, where it's used most. GitHub Actions is free for
# public repositories. The full run (installers on several systems, macOS, the live check
# that the subscription CLIs are locked down, the GUI in a real browser) stays in
# tests.yml, started by hand.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
