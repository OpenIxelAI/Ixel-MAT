name: checks

# The fast test suites, on every pull request and every push to main: Linux on the oldest
# Python Ixel MAT supports, and Windows, where it's used most. GitHub Actions is free for
# public repositories. The full run (installers on several systems, macOS, the live check
# that the subscription CLIs are locked down, the GUI in a real browser) stays in
# tests.yml, started by hand.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request stops its older run; every commit on main keeps its own result.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  agent-sandbox-linux:
    # The Agent's Linux sandbox for real: bubblewrap installed, Ubuntu's AppArmor rule applied the way the
    # Agent's own message says, then the sandbox tests that need a working bwrap (they skip elsewhere).
    name: Agent sandbox (Linux, bubblewrap)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: The sandbox can start
        run: |
          if [ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] && \
             [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = "1" ]; then
            echo "abi <abi/4.0>, profile bwrap $(realpath "$(command -v bwrap)") flags=(unconfined) { userns, }" \
              | sudo tee /etc/apparmor.d/bwrap
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          python -c 'from ixel_mat.agent import sandbox; r = sandbox.sandbox_unavailable_reason(); print(r or "bwrap works"); raise SystemExit(1 if r else 0)'
      - name: Sandbox tests
        run: python -m pytest -q -rs tests/test_agent_sandbox.py tests/test_agent_mcp_addons.py
