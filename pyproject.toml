[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ixel-mat"
dynamic = ["version"]
description = "Ask several AI models at once, let them peer-review each other, and get one verified answer."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "prompt_toolkit>=3.0.50",
    "websockets>=14.0",
    "cryptography>=41.0",
    "aiohttp>=3.9",
    "anthropic>=1.8",
    "mcp>=2.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ixel = "ixel_mat.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ixel_mat.__version__" }

[tool.setuptools.packages.find]
include = ["ixel_mat*"]

[tool.setuptools.package-data]
ixel_mat = ["assets/*.txt", "assets/*.ico", "assets/*.icns", "assets/*.png", "gui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
