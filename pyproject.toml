[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ixel-mat"
dynamic = ["version"]
description = "Ask several AI models at once, let them peer-review each other, and get one verified answer."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "prompt_toolkit>=3.0.50",
    "websockets>=14.0",
    "cryptography>=41.0",
    "aiohttp>=3.9",
    "anthropic>=1.8",
    "mcp>=2.2",
    "keyring>=24",
    "pypdf>=6.1",  # reads the text and pictures of PDFs attached to a question (documents.py)
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.1"]

[project.scripts]
ixel = "ixel_mat.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ixel_mat.__version__" }

[tool.setuptools.packages.find]
include = ["ixel_mat*"]

[tool.setuptools.package-data]
ixel_mat = ["assets/*.txt", "assets/*.ico", "assets/*.icns", "assets/*.png", "gui/static/*", "agent/starter/*.md",
            "agent/starter/skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# A hung test fails after this many seconds, with every thread's stack, instead of holding up CI until its own
# limit. The slowest test takes about 9 s; "thread" works on Windows too. A test that needs longer says so itself
# (@pytest.mark.timeout).
timeout = 120
timeout_method = "thread"
